name: Transmit a profile signal
description: Leave a short, public message for Naitik's GitHub profile channel.
title: "[profile-signal] "
body:
  - type: markdown
    attributes:
      value: |
        Keep it short and human. Signals are reviewed before they appear on the profile.
  - type: textarea
    id: signal
    attributes:
      label: Signal
      description: A question, hello, project thought, or note in 80 characters or fewer.
      placeholder: Built something interesting lately?
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public display
      options:
        - label: I understand this message and my GitHub username may appear publicly.
          required: true
