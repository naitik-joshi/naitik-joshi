name: Refresh community signals

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1"
      timezone: "Asia/Kathmandu"
  push:
    branches: [main]
    paths:
      - "signals-approved.json"
      - "scripts/render_signals.py"
      - "scripts/profile_core.py"
      - ".github/workflows/community-signals.yml"

permissions:
  contents: write
  issues: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Render approved signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_signals.py

      - name: Commit changed signal assets
        run: |
          if git diff --quiet -- assets/community-signals-*.svg; then
            echo "Community signal artwork is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/community-signals-dark.svg assets/community-signals-light.svg
          git commit -m "chore: refresh community signals [skip ci]"
          git push
