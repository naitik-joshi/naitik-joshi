<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Naitik Joshi - Kathmandu Network Node</title>
<desc id="desc">Four software projects with public repository signals connect to a Kathmandu network node above a city and mountain skyline.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.outer{fill:#EDF4F1;stroke:#789995;stroke-width:1.5}
.grid-line{fill:none;stroke:#D3E1DD;stroke-width:1}
.panel{fill:#F8FBF9;stroke:#789995;stroke-width:1.25}
.rule{stroke:#789995;stroke-width:1}
.label{fill:#087D70;font-size:13px;font-weight:700;letter-spacing:1px}
.identity{fill:#142426;font-size:31px;font-weight:800}
.identity-role{fill:#536B6D;font-size:14px}
.header-signal{fill:#142426;font-size:13px;font-weight:700}
.header-muted{fill:#536B6D;font-size:12px}
.body{fill:#142426;font-size:14px}.body-strong{fill:#142426;font-size:16px;font-weight:700}
.body-muted{fill:#536B6D;font-size:12px}.signal{fill:#087D70;font-size:12px;font-weight:700}
.route{fill:none;stroke:#0B748B;stroke-width:1.5;stroke-dasharray:5 7;opacity:.7}
.packet{fill:#087D70;filter:url(#glow)}
.node-box{fill:#F8FBF9;stroke-width:1.5}.node-machine{fill:#E1ECE8;stroke:#789995}
.node-title{fill:#142426;font-size:15px;font-weight:700}.node-status{font-size:9px;font-weight:700}
.node-stack{fill:#536B6D;font-size:10px}
.mint-stroke{stroke:#087D70;fill:none}.cyan-stroke{stroke:#0B748B;fill:none}.amber-stroke{stroke:#9B6200;fill:none}
.mint-fill{fill:#087D70}.cyan-fill{fill:#0B748B}.amber-fill{fill:#9B6200}
.mint-text{fill:#087D70}.cyan-text{fill:#0B748B}.amber-text{fill:#9B6200}
.node-halo{fill:#F8FBF9;stroke:#0B748B;opacity:.94}.node-core{fill:#E1ECE8;stroke:#087D70;stroke-width:2}
.tower{fill:#EDF4F1;stroke:#789995}.tower-line{stroke:#9B6200;stroke-width:2}
.beacon{fill:#B33E3B}.beacon-ring{fill:none;stroke:#B33E3B}
.central-title{fill:#0B748B;font-size:15px;font-weight:800}.central-subtitle{fill:#536B6D;font-size:10px;letter-spacing:1px}
.mountain-far{fill:#D5E3DF}.mountain-near{fill:#C3D6D1}
.city{fill:#AFC4BF}.city-line{stroke:#AFC4BF;stroke-width:3}.city-line.thin{stroke-width:1.5}
.window{fill:#9B6200;opacity:.85}.beacon-static{fill:#B33E3B}
.terminal{fill:#F8FBF9;stroke:#789995}.prompt{fill:#087D70;font-size:14px;font-weight:700}
.command{fill:#142426;font-size:14px}.cursor{fill:#0B748B;animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.pulse-ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{transform:scale(1.35);opacity:.65}}
@keyframes ring{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.75);opacity:0}}
@media(prefers-reduced-motion:reduce){.packet{display:none}.pulse,.pulse-ring,.cursor{animation:none!important}}
</style>
<rect x="12" y="12" width="1176" height="696" rx="4" class="outer"/>
<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" class="grid-line"/></pattern></defs><rect width="1200" height="720" fill="url(#grid)" opacity=".28"/>
<line x1="24" y1="86" x2="1176" y2="86" class="rule"/>
<text x="36" y="50" class="identity" text-anchor="start">Naitik Joshi</text>
<text x="38" y="72" class="identity-role" text-anchor="start">DEVELOPER / BUILDER / AI STUDENT</text>
<text x="1164" y="42" class="header-signal" text-anchor="end">KTM-NP-0545</text>
<text x="1164" y="62" class="header-muted" text-anchor="end">NPT +05:45 / PUBLIC API / WEEKLY</text>
