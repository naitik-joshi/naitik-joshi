<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">Naitik's moderated visitor channel</title>
<desc id="desc">Up to three approved GitHub Issue messages from profile visitors.</desc>
<style>
text{font-family:'Arial Narrow','Helvetica Neue',Arial,sans-serif;letter-spacing:0}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.author{fill:#F4F0E8;font-size:15px;font-weight:900}.message{fill:#F4F0E8;font-size:15px;font-weight:650}
.empty{fill:#F4F0E8;font-size:18px;font-weight:900}.pulse{animation:pulse 2.2s ease-out infinite;transform-origin:1140px 39px}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<rect width="1200" height="180" fill="#101217"/>
<rect x="10" y="10" width="1180" height="160" fill="#171A21" stroke="#F4F0E8" stroke-width="3"/>
<rect x="24" y="24" width="1152" height="35" fill="#3B6CFF"/>
<text x="40" y="48" class="author mono" text-anchor="start">VISITOR CHANNEL / MODERATED</text>
<text x="1155" y="48" class="author mono" text-anchor="end">00 SIGNALS</text>
<circle cx="1140" cy="39" r="6" fill="#FF5A5F"/><circle cx="1140" cy="39" r="11" fill="none" stroke="#FF5A5F" stroke-width="3" class="pulse"/>
<text x="40" y="111" class="empty mono" text-anchor="start">NO APPROVED SIGNALS YET</text><text x="40" y="140" class="message" text-anchor="start">Open the channel through GitHub Issues. Messages are reviewed before broadcast.</text>
</svg>
