  <rect x="64" y="367" width="178" height="27" class="yellow"/>
  <text x="76" y="386" class="status-on-light" text-anchor="start">HACKATHON PROTOTYPE</text>
  <text x="64" y="441" class="project-copy-mobile" text-anchor="start">An AI-assisted research workspace with researcher</text>
<text x="64" y="465" class="project-copy-mobile" text-anchor="start">tools and a focused CMS.</text>
