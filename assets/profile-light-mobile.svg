  <circle cx="614" cy="513" r="8" class="yellow"/>
</g>
</g>
<g class="feature scene-3">
  <text x="620" y="378" class="number" text-anchor="end">03</text>
  <text x="64" y="342" class="project-name-mobile" text-anchor="start">API Escape</text>
  <rect x="64" y="367" width="202" height="27" class="blue"/>
  <text x="76" y="386" class="status-on-dark" text-anchor="start">COMPLETED TEAM PROJECT</text>
  <text x="64" y="441" class="project-copy-mobile" text-anchor="start">A containerized FastAPI learning platform with</text>
<text x="64" y="465" class="project-copy-mobile" text-anchor="start">Groq-assisted guidance.</text>
  <text x="64" y="626" class="meta mono" text-anchor="start">FASTAPI + DOCKER  /  Python</text>
  <text x="64" y="651" class="meta mono" text-anchor="start">ST 0  /  FK 0  /  UPDATED 08-24</text>
  <g>
  <rect x="438" y="470" width="204" height="150" fill="none" class="line" stroke-width="3"/>
  <rect x="457" y="498" width="52" height="38" fill="none" class="line" stroke-width="3"/>
