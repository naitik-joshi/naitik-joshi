  <text x="64" y="441" class="project-copy-mobile" text-anchor="start">An AI-assisted research workspace built for the</text>
<text x="64" y="465" class="project-copy-mobile" text-anchor="start">Islington Hackathon, with researcher tools and a</text>
<text x="64" y="489" class="project-copy-mobile" text-anchor="start">focused CMS.</text>
  <text x="64" y="626" class="meta mono" text-anchor="start">NEXT + SUPABASE  /  TypeScript</text>
  <text x="64" y="651" class="meta mono" text-anchor="start">ST 0  /  FK 0  /  UPDATED 09-13</text>
  <g fill="none" class="line" stroke-width="3">
