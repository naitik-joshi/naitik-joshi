  <circle cx="484" cy="590" r="10" class="mint" stroke="none"/><circle cx="586" cy="574" r="13" class="red" stroke="none"/>
  <circle cx="614" cy="506" r="9" class="yellow" stroke="none"/>
</g>
</g>
<g class="feature scene-3">
  <text x="620" y="378" class="number" text-anchor="end">03</text>
  <text x="64" y="342" class="project-name-mobile" text-anchor="start">API Escape</text>
  <rect x="64" y="367" width="202" height="27" class="blue"/>
  <text x="76" y="386" class="status" text-anchor="start">COMPLETED TEAM PROJECT</text>
  <text x="64" y="441" class="project-copy-mobile" text-anchor="start">A containerized API learning platform with</text>
<text x="64" y="465" class="project-copy-mobile" text-anchor="start">Groq-assisted workflows, built and presented as a</text>
<text x="64" y="489" class="project-copy-mobile" text-anchor="start">summer team project.</text>
  <text x="64" y="626" class="meta mono" text-anchor="start">FASTAPI + DOCKER  /  Python</text>
  <text x="64" y="651" class="meta mono" text-anchor="start">ST 0  /  FK 0  /  UPDATED 08-24</text>
  <g fill="none" class="line" stroke-width="4">
