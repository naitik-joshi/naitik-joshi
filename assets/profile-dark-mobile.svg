<rect x="415" y="268" width="28" height="32" rx="2" class="node-machine"/>
<line x1="421" y1="277" x2="437" y2="277" class="cyan-stroke"/>
<line x1="421" y1="286" x2="437" y2="286" class="cyan-stroke"/>
<circle cx="423" cy="295" r="2" class="cyan-fill"/>
<text x="453" y="280" class="node-title" text-anchor="start">API Escape</text>
<text x="453" y="301" class="node-status cyan-text" text-anchor="start">COMPLETED TEAM PROJECT</text>
<text x="415" y="328" class="node-stack" text-anchor="start">FASTAPI + DOCKER / UPDATED 08-24</text>
</g>
<g class="project-node" aria-label="Tab Unloader">
<rect x="401" y="502" width="258" height="92" rx="3" class="node-box mint-stroke"/>
<rect x="415" y="516" width="28" height="32" rx="2" class="node-machine"/>
<line x1="421" y1="525" x2="437" y2="525" class="mint-stroke"/>
<line x1="421" y1="534" x2="437" y2="534" class="mint-stroke"/>
<circle cx="423" cy="543" r="2" class="mint-fill"/>
<text x="453" y="528" class="node-title" text-anchor="start">Tab Unloader</text>
<text x="453" y="549" class="node-status mint-text" text-anchor="start">STABLE</text>
<text x="415" y="576" class="node-stack" text-anchor="start">CHROMIUM EXTENSION / UPDATED 05-22</text>
</g>
<rect x="24" y="902" width="672" height="36" rx="2" class="terminal"/>
<text x="39" y="926" class="prompt" text-anchor="start">naitik@ktm:~$</text>
<text x="177" y="926" class="command" text-anchor="start">building useful and unusual software</text>
<rect x="516" y="913" width="8" height="17" class="cursor"/>
</svg>