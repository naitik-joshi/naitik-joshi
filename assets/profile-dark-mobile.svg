  <text x="64" y="651" class="meta mono" text-anchor="start">ST 0  /  FK 0  /  UPDATED 08-27</text>
  <g><rect x="454" y="552" width="10" height="26" class="mint" opacity="0.35"/><rect x="472" y="530" width="10" height="48" class="mint" opacity="0.40"/><rect x="490" y="508" width="10" height="70" class="mint" opacity="0.46"/><rect x="508" y="484" width="10" height="94" class="mint" opacity="0.52"/><rect x="526" y="524" width="10" height="54" class="mint" opacity="0.57"/><rect x="544" y="545" width="10" height="33" class="mint" opacity="0.62"/><rect x="562" y="500" width="10" height="78" class="mint" opacity="0.68"/><rect x="580" y="476" width="10" height="102" class="mint" opacity="0.73"/><rect x="598" y="514" width="10" height="64" class="mint" opacity="0.79"/><path d="M452 590H632" class="line" stroke-width="3"/></g>
</g>
