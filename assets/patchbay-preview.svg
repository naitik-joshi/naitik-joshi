<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title desc">
<title id="title">KTM Patchbay: open the interactive JSON and text workbench</title>
<desc id="desc">An animated example sends JSON through a transformation circuit into CSV. Click the preview to open the working tool on GitHub Pages.</desc>
<style>text{font-family:monospace;fill:#e7ebed}.muted{fill:#9ca7b7}.packet{animation:pulse 3s infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.packet{animation:none}.moving{display:none}}</style>
<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#303745"/></pattern></defs>
<rect width="100%" height="100%" rx="6" fill="#0d1117"/>
<rect x="1" y="1" width="1098" height="268" rx="5" fill="url(#grid)" stroke="#46505e"/>
<path d="M1 33H1099" stroke="#46505e"/>
<circle cx="20" cy="17" r="4" fill="#ff6569"/><circle cx="35" cy="17" r="4" fill="#ffcf58"/><circle cx="50" cy="17" r="4" fill="#71e3ba"/>
<text x="72" y="22" font-size="11" class="muted">NAITIK'S OPEN CIRCUIT LAB</text>
<text x="1080" y="22" text-anchor="end" font-size="11" class="muted">02 / EXPERIMENT</text>
<text x="30" y="83" font-size="37" font-weight="700">KTM <tspan fill="#ff6569">//</tspan> PATCHBAY</text>
<text x="32" y="112" font-size="15" class="muted">Small modules. Useful transformations.</text>
<text x="32" y="142" font-size="14" class="muted">JSON / TEXT / YOUR BROWSER</text><rect x="32" y="173" width="220" height="32" fill="#71e3ba"/><text x="48" y="194" style="fill:#0d1117" font-size="14" font-weight="700">OPEN THE WORKBENCH &#8599;</text><rect x="494" y="70" width="156" height="139" fill="#05070a"/><rect x="490" y="65" width="156" height="139" rx="3" fill="#191e27" stroke="#46505e"/><path d="M490 66h156" stroke="#ff6569" stroke-width="3"/><text x="503" y="89" font-size="13" style="fill:#ff6569" font-weight="700">INPUT</text><path d="M490 101h156" stroke="#343e4b"/><text x="504" y="130" font-size="13">[{"city":"KTM",</text><text x="504" y="152" font-size="13"> "offset":545}]</text><text x="504" y="187" font-size="11" class="muted">JSON PAYLOAD</text><path d="M646 134H690" stroke="#ff6569" stroke-width="2"/><circle cx="646" cy="134" r="4" fill="#0d1117" stroke="#ff6569" stroke-width="2"/><circle cx="690" cy="134" r="4" fill="#0d1117" stroke="#ff6569" stroke-width="2"/><circle class="moving" r="4" fill="#ff6569"><animateMotion dur="1.8s" begin="0.0s" repeatCount="indefinite" path="M646 134H690"/></circle><rect x="694" y="70" width="156" height="139" fill="#05070a"/><rect x="690" y="65" width="156" height="139" rx="3" fill="#191e27" stroke="#46505e"/><path d="M690 66h156" stroke="#ffcf58" stroke-width="3"/><text x="703" y="89" font-size="13" style="fill:#ffcf58" font-weight="700">TRANSFORM</text><path d="M690 101h156" stroke="#343e4b"/><rect class="packet" x="705" y="141" width="9" height="14" fill="#ffcf58" style="animation-delay:0.0s"/><rect class="packet" x="721" y="130" width="9" height="25" fill="#ffcf58" style="animation-delay:0.14s"/><rect class="packet" x="737" y="116" width="9" height="39" fill="#ffcf58" style="animation-delay:0.28s"/><rect class="packet" x="753" y="133" width="9" height="22" fill="#ffcf58" style="animation-delay:0.42000000000000004s"/><rect class="packet" x="769" y="109" width="9" height="46" fill="#ffcf58" style="animation-delay:0.56s"/><rect class="packet" x="785" y="122" width="9" height="33" fill="#ffcf58" style="animation-delay:0.7000000000000001s"/><rect class="packet" x="801" y="135" width="9" height="20" fill="#ffcf58" style="animation-delay:0.8400000000000001s"/><rect class="packet" x="817" y="120" width="9" height="35" fill="#ffcf58" style="animation-delay:0.9800000000000001s"/><text x="704" y="187" font-size="11" class="muted">PARSE / SELECT / CSV</text><path d="M846 134H890" stroke="#ffcf58" stroke-width="2"/><circle cx="846" cy="134" r="4" fill="#0d1117" stroke="#ffcf58" stroke-width="2"/><circle cx="890" cy="134" r="4" fill="#0d1117" stroke="#ffcf58" stroke-width="2"/><circle class="moving" r="4" fill="#ffcf58"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M846 134H890"/></circle><rect x="894" y="70" width="156" height="139" fill="#05070a"/><rect x="890" y="65" width="156" height="139" rx="3" fill="#191e27" stroke="#46505e"/><path d="M890 66h156" stroke="#71e3ba" stroke-width="3"/><text x="903" y="89" font-size="13" style="fill:#71e3ba" font-weight="700">OUTPUT</text><path d="M890 101h156" stroke="#343e4b"/><text x="904" y="130" font-size="14">city,offset</text><text x="904" y="153" font-size="14" style="fill:#71e3ba">KTM,545</text><text x="904" y="187" font-size="11" class="muted">CSV RESULT</text><path d="M20 231H1080" stroke="#343e4b"/><text x="32" y="254" font-size="12" class="muted">ANIMATED PREVIEW / FULL TOOL ON GITHUB PAGES</text><circle cx="1070" cy="250" r="4" fill="#71e3ba"/></svg>